name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Compute next version
        id: version
        run: |
          LAST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            NEW="0.0.1"
          else
            IFS='.' read -r MAJ MIN PAT <<< "${LAST_TAG#v}"
            NEW="${MAJ}.${MIN}.$((PAT + 1))"
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Build macOS archive (ad-hoc signed)
        run: |
          xcodebuild \
            -project VideoPlaylistPlayer.xcodeproj \
            -scheme VideoPlaylistPlayer \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/VideoPlaylistPlayer.xcarchive \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            archive

      - name: Stage .app for DMG
        run: |
          mkdir -p build/export
          cp -R build/VideoPlaylistPlayer.xcarchive/Products/Applications/VideoPlaylistPlayer.app build/export/

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          chmod +x scripts/build-dmg.sh
          scripts/build-dmg.sh "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG="VideoPlaylistPlayer-${VERSION}.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" \
              --title "VideoPlaylistPlayer $VERSION" \
              --generate-notes
          fi
